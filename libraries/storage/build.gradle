apply from: "${project.rootDir}/gradle-tasks-for-libraries.gradle"

task test(type: Exec) {
    dependsOn npmInstall
    dependsOn ":verifyTsc"
    inputs.files fileTree(dir: "src", include: "**/*.ts")
    inputs.files fileTree(dir: "test", include: "**/*.ts")
    inputs.file "tsconfig.test.json"
    commandLine npmExecutable
    args "test"
}

npmPack.dependsOn test
